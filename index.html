<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgroSat — Monitoramento Agrícola</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">🌱</span>
        <div>
          <h1>AgroSat</h1>
          <p>Monitoramento Agrícola por Satélite</p>
        </div>
      </div>
      <div class="header-right">
        <span id="clock"></span>
        <button class="btn-primary" onclick="abrirModal()">+ Nova Fazenda</button>
      </div>
    </div>
  </header>

  <main>

    <!-- SELETOR DE FAZENDA -->
    <section class="farm-selector">
      <label>Fazenda selecionada:</label>
      <select id="selectFazenda" onchange="atualizarDashboard()"></select>
      <button class="btn-secondary" onclick="gerarNovaLeitura()">↻ Atualizar Leitura</button>
    </section>

    <!-- ALERTA PRINCIPAL -->
    <div id="alerta-banner" class="alerta-banner"></div>

    <!-- CARDS DE CLIMA -->
    <section class="grid-cards">
      <div class="card">
        <div class="card-icon">🌡️</div>
        <div class="card-info">
          <span class="card-label">Temperatura</span>
          <span class="card-value" id="temperatura">--</span>
        </div>
      </div>
      <div class="card">
        <div class="card-icon">💧</div>
        <div class="card-info">
          <span class="card-label">Umidade</span>
          <span class="card-value" id="umidade">--</span>
        </div>
      </div>
      <div class="card">
        <div class="card-icon">🌧️</div>
        <div class="card-info">
          <span class="card-label">Chuva Simulada</span>
          <span class="card-value" id="chuva">--</span>
        </div>
      </div>
      <div class="card">
        <div class="card-icon">🌤️</div>
        <div class="card-info">
          <span class="card-label">Previsão</span>
          <span class="card-value small" id="previsao">--</span>
        </div>
      </div>
    </section>

    <!-- DASHBOARD INFERIOR -->
    <section class="grid-bottom">

      <!-- GRÁFICO -->
      <div class="panel">
        <h2>Monitoramento — Últimas 7 Leituras</h2>
        <canvas id="grafico"></canvas>
      </div>

      <!-- STATUS DA PLANTAÇÃO -->
      <div class="panel">
        <h2>Status das Plantações</h2>
        <div id="lista-fazendas" class="fazenda-list"></div>
      </div>

      <!-- MAPA / IMAGEM SATÉLITE SIMULADA -->
      <div class="panel panel-mapa">
        <h2>Imagem de Satélite Simulada</h2>
        <div class="mapa-container">
          <div class="mapa">
            <div class="mapa-legenda">
              <span id="mapa-fazenda-nome">—</span>
              <span id="mapa-coord">Lat: -21.1° Long: -47.8°</span>
            </div>
            <svg id="mapa-svg" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
              <!-- Fundo de solo -->
              <rect width="300" height="200" fill="#5a7a3a"/>
              <!-- Talhões -->
              <rect x="10"  y="10"  width="80" height="55" fill="#6d9e45" rx="3"/>
              <rect x="100" y="10"  width="90" height="55" fill="#4e8c2f" rx="3"/>
              <rect x="200" y="10"  width="90" height="55" fill="#7ab348" rx="3"/>
              <rect x="10"  y="75"  width="60" height="60" fill="#5d9240" rx="3"/>
              <rect x="80"  y="75"  width="100" height="60" fill="#82be52" rx="3"/>
              <rect x="190" y="75"  width="100" height="60" fill="#4a7a30" rx="3"/>
              <rect x="10"  y="145" width="130" height="45" fill="#70a844" rx="3"/>
              <rect x="150" y="145" width="140" height="45" fill="#5e9138" rx="3"/>
              <!-- Estradas -->
              <line x1="95"  y1="0"   x2="95"  y2="200" stroke="#c8a96e" stroke-width="3"/>
              <line x1="0"   y1="70"  x2="300" y2="70"  stroke="#c8a96e" stroke-width="3"/>
              <line x1="0"   y1="140" x2="300" y2="140" stroke="#c8a96e" stroke-width="3"/>
              <!-- Marcador da fazenda -->
              <circle id="mapa-marker" cx="150" cy="100" r="8" fill="#ff4444" opacity="0.9"/>
              <circle id="mapa-marker-pulse" cx="150" cy="100" r="14" fill="none" stroke="#ff4444" stroke-width="2" opacity="0.5"/>
            </svg>
            <div id="mapa-risco-overlay" class="mapa-risco-overlay"></div>
          </div>
          <div class="mapa-info">
            <div class="mapa-info-item"><span>Área</span><strong id="mapa-area">--</strong></div>
            <div class="mapa-info-item"><span>Cultura</span><strong id="mapa-cultura">--</strong></div>
            <div class="mapa-info-item"><span>Status</span><strong id="mapa-status">--</strong></div>
            <div class="mapa-info-item"><span>Risco</span><strong id="mapa-risco">--</strong></div>
          </div>
        </div>
      </div>

    </section>
  </main>

  <!-- MODAL CADASTRO -->
  <div id="modal-overlay" class="modal-overlay hidden" onclick="fecharModalFora(event)">
    <div class="modal">
      <div class="modal-header">
        <h2>Cadastrar Fazenda</h2>
        <button class="btn-fechar" onclick="fecharModal()">✕</button>
      </div>
      <form onsubmit="cadastrarFazenda(event)">
        <div class="form-group">
          <label>Nome da Fazenda</label>
          <input type="text" id="f-nome" placeholder="Ex: Fazenda Santa Fé" required />
        </div>
        <div class="form-group">
          <label>Localização</label>
          <input type="text" id="f-local" placeholder="Ex: Ribeirão Preto - SP" required />
        </div>
        <div class="form-group">
          <label>Cultura Plantada</label>
          <select id="f-cultura">
            <option>Milho</option>
            <option>Soja</option>
            <option>Trigo</option>
            <option>Café</option>
            <option>Cana-de-Açúcar</option>
            <option>Algodão</option>
            <option>Outro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Status da Plantação</label>
          <select id="f-status">
            <option value="Em Crescimento">Em Crescimento</option>
            <option value="Pronta para Colheita">Pronta para Colheita</option>
            <option value="Recém Plantada">Recém Plantada</option>
            <option value="Danificada">Danificada</option>
          </select>
        </div>
        <div class="form-group">
          <label>Área (hectares)</label>
          <input type="number" id="f-area" placeholder="Ex: 120" min="1" required />
        </div>
        <button type="submit" class="btn-primary full-width">Cadastrar</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
